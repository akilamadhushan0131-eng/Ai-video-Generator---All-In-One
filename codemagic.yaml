workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        APP_ID: com.example.sinhala_ai_studio
    scripts:
      - name: Create Flutter Android project if missing
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create --org com.example --project-name sinhala_ai_studio --platforms=android --overwrite .
          fi
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - akilamadhushan0131@gmail.com
